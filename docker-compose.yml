# Self-hosting: `cp .env.example .env`, fill it in, `docker compose up --build`. See docs/self-hosting.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: niyyah
      POSTGRES_USER: niyyah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyyah"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.standalone
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      STORAGE_BACKEND: db
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://niyyah:${POSTGRES_PASSWORD}@db:5432/niyyah
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      REGISTRATION: ${REGISTRATION:-open}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3000}
      WEB_PUBLIC_URL: ${WEB_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_URL:-http://localhost:8000}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.standalone
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_OPERATOR_NAME: ${OPERATOR_NAME:-}
        NEXT_PUBLIC_OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
        NEXT_PUBLIC_SITE_URL: ${WEB_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
