name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: "1. Open Settings\n2. ...\n3. ..."
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you run.
  - type: dropdown
    id: where
    attributes:
      label: How are you running it
      options: [docker compose, behind a reverse proxy, local development, other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs api` or the browser console. Remove anything private first.
      render: shell
