name: Idea or feature request
description: Suggest something that would make Niyyah better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do
      description: Describe the situation, not only the feature. Niyyah stays small on purpose, so the why matters most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
