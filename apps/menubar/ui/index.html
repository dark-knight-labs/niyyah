<!doctype html>
<html lang="en" class="desktop quick">
<head>
  <meta charset="utf-8">
  <title>Niyyah Capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="popover.css">
</head>
<body>
  <dialog id="voice" open aria-label="Quick capture">
    <form id="capture-form" autocomplete="off">
      <div class="composer-field">
        <input class="transcript" id="text" type="text" maxlength="300" placeholder="What is on your mind?" aria-label="Capture" autofocus>
      </div>
      <p id="status" role="status"></p>
      <div class="composer-niyyah" id="picker"></div>
      <div class="composer-actions">
        <button id="open-settings" type="button">Settings</button>
        <button class="primary save" id="save" type="submit">Save</button>
      </div>
      <ul id="queue" aria-label="Waiting to be sent"></ul>
    </form>
  </dialog>
  <script src="tasklogic.js"></script>
  <script src="picker.js"></script>
  <script src="app.js"></script>
</body>
</html>
