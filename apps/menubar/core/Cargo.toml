[package]
name = "niyyah-capture-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# The macOS Keychain store. Off by default so the crate builds and tests on Linux.
keychain = ["dep:keyring"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
