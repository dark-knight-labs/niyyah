[package]
name = "niyyah-capture"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
niyyah-capture-core = { path = "../core", features = ["keychain"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
