stages:
  - build
  - deploy

variables:
  REGISTRY: $CI_REGISTRY_IMAGE

.build:
  stage: build
  image: docker:27
  tags: [homelab]
  services:
    - name: docker:27-dind
      command: ["--dns", "8.8.8.8"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://localhost:2375
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:api:
  extends: .build
  script:
    - docker build --network host -t $REGISTRY/api:latest -t $REGISTRY/api:$CI_COMMIT_SHORT_SHA apps/api/
    - docker push $REGISTRY/api --all-tags

build:web:
  extends: .build
  script:
    - docker build --network host -t $REGISTRY/web:latest -t $REGISTRY/web:$CI_COMMIT_SHORT_SHA apps/web/
    - docker push $REGISTRY/web --all-tags

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  tags: [homelab]
  needs: ["build:api", "build:web"]
  script:
    # Pin to the immutable sha tag just pushed above, instead of restarting
    # onto :latest — a registry outage during a pod reschedule can no longer
    # strand a deploy (see imagePullPolicy: IfNotPresent in the k8s manifest,
    # burak repo).
    - kubectl set image deployment/niyyah-api api=$REGISTRY/api:$CI_COMMIT_SHORT_SHA -n niyyah
    - kubectl set image deployment/niyyah-web web=$REGISTRY/web:$CI_COMMIT_SHORT_SHA -n niyyah
    - kubectl rollout status deployment/niyyah-api -n niyyah --timeout=120s
    - kubectl rollout status deployment/niyyah-web -n niyyah --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
